# Publica la app en GitHub Pages automáticamente en cada cambio.
# También intenta activar Pages solo (enablement), para no tener que
# prender el interruptor a mano en Settings.
name: Publicar la app

on:
  push:
    branches:
      - claude/grocery-inventory-app-is6fos
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar (y activar) GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar la app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
